<!doctype html>
<html
  th:lang="${#locale.toLanguageTag}"
  th:fragment="html (title,header,content,head,footer,leftSidebar,htmlType)"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:with="pageList = ${posts != null ? posts : (archives != null ? archives : (moments != null ? moments : friends))},
             pageNumber = ${pageList != null ? pageList.page : 1},
             emptyPagination = ${pageList != null and pageNumber > 1 and #lists.isEmpty(pageList.items)},
             pageTitle = ${pageNumber > 1 ? ((htmlType == 'category' or htmlType == 'tag') ? (htmlType == 'category' ? category.spec.displayName : tag.spec.displayName) + ' - 第 ' + pageNumber + ' 页 - ' + site.title : title + ' - 第 ' + pageNumber + ' 页') : title},
             pageSuffix = ${pageNumber > 1 and !emptyPagination ? '（第 ' + pageNumber + ' 页）' : ''},
             archiveDescription = ${category != null ? (!#strings.isEmpty(#strings.trim(category.spec.description)) ? category.spec.description : site.title + '「' + category.spec.displayName + '」分类下的 ' + posts.total + ' 篇文章') + pageSuffix : (tag != null ? site.title + '中与「' + tag.spec.displayName + '」相关的 ' + posts.total + ' 篇文章' + pageSuffix : null)},
             seoMetaDescription = ${archiveDescription != null ? archiveDescription : seoMetaDescription}"
  >
    <meta charset="utf-8" />
    <!--
      🧹 遗留 Service Worker 迁移清理（refs v1.5.1-next.15）
      面向"原来是 hexo/wordpress/其它框架、迁移到 Halo+本主题"的博主场景：
      老访客浏览器里可能残留前主题注册的 ServiceWorker + CacheStorage，
      会 intercept network 请求返回缓存的旧 HTML，访客永远看到旧站。
      服务器端 Cache-Control 对已注册的 SW 完全无效（SW 在 network 之前）。
      唯一解法：在浏览器里 unregister SW + 清 caches。

      设计：
      - 必须 inline（external script 会被老 SW 拦截返回 404 或失效）
      - 必须在 <head> 最早位置（最早执行，尽快释放被 SW 劫持的资源）
      - localStorage 标记一次性（已清过的用户再访问 0 开销 early-return）
      - 不支持 SW 的浏览器直接 return（IE / 老 Safari）
      - 清完后 setTimeout 100ms 自动 reload 让新内容立即可见
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var KEY = 'joe3_legacy_sw_cleared_v1';
        try {
          if (localStorage.getItem(KEY)) return;
        } catch (e) {
          return;
        }
        var dirty = false;
        var tasks = [
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              if (regs && regs.length) {
                dirty = true;
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  })
                );
              }
            })
            .catch(function () {}),
        ];
        if ('caches' in window) {
          tasks.push(
            caches
              .keys()
              .then(function (names) {
                if (names && names.length) {
                  dirty = true;
                  return Promise.all(
                    names.map(function (n) {
                      return caches.delete(n);
                    })
                  );
                }
              })
              .catch(function () {})
          );
        }
        Promise.all(tasks).then(function () {
          try {
            localStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          if (dirty) {
            setTimeout(function () {
              location.reload();
            }, 100);
          }
        });
      })();
    </script>

    <title th:text="${pageTitle}"></title>

    <meta name="renderer" content="webkit" />
    <meta name="format-detection" content="email=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta
      name="author"
      th:content="${theme.config.blogger.nickname}"
      th:if="${#strings.trim(theme.config.blogger.nickname)} !=''"
    />
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <meta name="site" th:content="${site.url}" />

    <!-- 使用 Halo 固定链接和分页 URL，兼容自定义分类、标签和归档路由。 -->
    <th:block
      th:with="siteUrlClean = ${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},
               basePath = ${post != null ? post.status.permalink : (singlePage != null ? singlePage.status.permalink : (category != null ? category.status.permalink : (tag != null ? tag.status.permalink : (author != null ? posts.prevUrl.replaceAll('[?#].*$', '').replaceAll('/page/[0-9]+/?$', '') : (htmlType == 'index' ? '/' : (htmlType == 'categories' ? site.routes.categoriesUri : (htmlType == 'tags' ? site.routes.tagsUri : (htmlType == 'archives' ? archives.prevUrl.replaceAll('[?#].*$', '').replaceAll('/page/[0-9]+/?$', '') : (htmlType == 'journals' ? '/moments' + (moment != null ? '/' + moment.metadata.name : '') : '/' + htmlType)))))))))},
               pagePath = ${pageNumber > 1 and !emptyPagination ? pageList.prevUrl.replaceAll('[?#].*$', '').replaceAll('/page/[0-9]+/?$', '').replaceAll('/$', '') + '/page/' + pageNumber : basePath},
               pageUrl = ${#strings.startsWith(pagePath, 'http://') or #strings.startsWith(pagePath, 'https://') ? pagePath : siteUrlClean + (#strings.startsWith(pagePath, '/') ? '' : '/') + pagePath},
               shareImage = ${post != null ? post.spec.cover : (category != null and !#strings.isEmpty(category.spec.cover) ? category.spec.cover : theme.config.seo?.default_share_image)},
               hasCover = ${!#strings.isEmpty(shareImage)},
               ogTitle = ${post != null ? post.spec.title : (singlePage != null ? singlePage.spec.title : pageTitle)},
               ogDesc = ${post != null ? (!#strings.isEmpty(post.status.excerpt) ? post.status.excerpt : site.seo.description) : (singlePage != null ? singlePage.status.excerpt : (archiveDescription != null ? archiveDescription : (htmlType == 'categories' ? site.title + '的文章分类' : (htmlType == 'tags' ? site.title + '的文章标签' : site.seo.description))))}"
    >
      <!-- 首页 description 由 Halo 自动注入，其余页面由主题补齐。 -->
      <meta name="description" th:if="${htmlType != 'index'}" th:content="${ogDesc}" />
      <link rel="canonical" th:href="${pageUrl}" />
      <meta
        name="robots"
        content="noindex, follow"
        th:if="${htmlType == 'tag' or htmlType == 'tags' or emptyPagination}"
      />
      <!-- theme-color · 移动端地址栏着色 -->
      <meta name="theme-color" content="#3a63ed" />
      <meta name="msapplication-TileColor" content="#3a63ed" />

      <!-- 无封面文章保持纯文字分享；非文章页可配置横版默认分享图。 -->
      <th:block
        th:if="${hasCover}"
        th:with="ogImageAbs = ${#strings.startsWith(shareImage, 'http://') or #strings.startsWith(shareImage, 'https://') ? shareImage : (#strings.startsWith(shareImage, '//') ? #strings.substringBefore(site.url, ':') + ':' + shareImage : siteUrlClean + (#strings.startsWith(shareImage, '/') ? '' : '/') + shareImage)},
                 ogImagePath = ${#strings.toLowerCase(ogImageAbs.replaceAll('[?#].*$', ''))}"
      >
        <meta property="og:image" th:content="${ogImageAbs}" />
        <!-- v1.6.9: og:image:alt 提升分享卡辅助文本 + a11y -->
        <meta property="og:image:alt" th:content="${ogTitle}" />
        <!-- v1.6.9: og:image:type (按 URL 后缀推断) -->
        <meta
          property="og:image:type"
          th:content="${#strings.endsWith(ogImagePath, '.png') ? 'image/png' : (#strings.endsWith(ogImagePath, '.webp') ? 'image/webp' : (#strings.endsWith(ogImagePath, '.gif') ? 'image/gif' : 'image/jpeg'))}"
        />
        <meta name="twitter:image" th:content="${ogImageAbs}" />
        <!-- v1.6.9: twitter:image:alt · X 辅助文本 -->
        <meta name="twitter:image:alt" th:content="${ogTitle}" />
      </th:block>
      <!-- Fix upstream bug: was th:content="site.seo.description" (missing ${}),
           rendered the literal string "site.seo.description" as the social
           preview description. -->
      <meta property="og:description" th:content="${ogDesc}" />
      <meta property="og:type" th:content="${post != null ? 'article' : 'website'}" />
      <meta property="og:locale" content="zh_CN" />
      <meta property="og:site_name" th:content="${site.title}" />
      <meta property="og:url" th:content="${pageUrl}" />
      <!-- v1.6.11.6: og:title 改用 ogTitle (post 用 post.spec.title) 而非 ${title}.
                      原 ${title} = "post.spec.title - site.title", 跟 og:site_name
                      重复显示, Telegram 渲染标题超长 + 看着像撞名. -->
      <meta property="og:title" th:content="${ogTitle}" />
      <meta
        property="article:modified_time"
        th:if="${post != null and (post.status.lastModifyTime != null or post.spec.publishTime != null)}"
        th:content="${#dates.format(post.status.lastModifyTime ?: post.spec.publishTime, 'yyyy-MM-dd''T''HH:mm:ssXXX')}"
      />

      <!-- Twitter Card · summary_large_image 让 X 分享卡显示大图 -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" th:content="${ogTitle}" />
      <meta name="twitter:description" th:content="${ogDesc}" />
    </th:block>
    <meta property="twitter:partner" content="ogwp" />
    <!-- /OG -->

    <!--
      JSON-LD structured data · v1.6.8
      Schema.org 富结果(rich results)标记: WebSite(全页) / BlogPosting(文章) / BreadcrumbList(文章).
      独立 fragment 便于未来加 schema type (如 Person / FAQ / HowTo).
    -->
    <th:block th:replace="~{modules/macro/json_ld :: json_ld_blocks}" />

    <!--
      Google AdSense Auto Ads (refs Q3)
      仅在广告总开关、enable_adsense 同时打开且 client_id 非空时注入主脚本 + preconnect。
      Auto Ads 下位置/lazy 由 Google 端控制，主题侧只负责早期加载主脚本。
    -->
    <th:block
      th:if="${#bools.isTrue(theme.config.ads.enable_ads)} and ${#bools.isTrue(theme.config.ads.enable_adsense)} and ${!#strings.isEmpty(theme.config.ads.adsense_client_id)}"
    >
      <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin="" />
      <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin="" />
      <script
        async
        th:src="'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ${theme.config.ads.adsense_client_id}"
        crossorigin="anonymous"
      ></script>
    </th:block>

    <th:block th:replace="~{modules/config :: config}" />
    <th:block th:replace="~{modules/link :: links}" />
    <th:block
      th:with="source_link=${(#strings.trim(theme.config.basic.source_link) != '' and #bools.isTrue(theme.config.basic.enable_source_link) and !#strings.contains(#strings.toLowerCase(#strings.trim(theme.config.basic.source_link)), 'jiewenhuang/halo-theme-joe3.0') and !#strings.contains(#strings.toLowerCase(#strings.trim(theme.config.basic.source_link)), 'jiewenhuang.github.io')) ? #strings.trim(theme.config.basic.source_link) : '/themes/theme-Joe3'}"
    >
      <script th:src="${source_link+'/assets/lib/jquery@3.7.1/jquery.min.js'}"></script>
    </th:block>
  </head>
  <!-- /OG -->
  <th:block th:replace="${content}"></th:block>
</html>
