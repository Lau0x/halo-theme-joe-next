<!doctype html>
<html th:lang="${#locale.toLanguageTag}" xmlns:th="http://www.thymeleaf.org">
  <th:block
    th:fragment="tail"
    th:with="source_link=${(#strings.trim(theme.config.basic.source_link) != '' and #bools.isTrue(theme.config.basic.enable_source_link) and !#strings.contains(#strings.toLowerCase(#strings.trim(theme.config.basic.source_link)), 'jiewenhuang/halo-theme-joe3.0') and !#strings.contains(#strings.toLowerCase(#strings.trim(theme.config.basic.source_link)), 'jiewenhuang.github.io')) ? #strings.trim(theme.config.basic.source_link) : '/themes/theme-Joe3'}"
  >
    <!--    ===== 引入脚本 start ===== -->
    <!-- jQuery 在 head 同步加载以兼容正文插件；其余外部主题脚本统一 defer。 -->
    <script
      defer
      th:if="${#bools.isTrue(theme.config.blogger.enable_strips)}"
      th:src="${source_link+'/assets/effect/bg/strips.js?v='+theme.spec.version}"
    ></script>
    <!--
      MED-3 v1.6.10: 按页面类型条件加载 JS lib, 减少不需要该 lib 的页面下载成本.
      wowjs: 只在 journals/friends/index 对应动画开关启用时加载 · ~17KB
      fancybox: 只在 post/photos/journals/sheet (有图片 lightbox 可能) 加载 · ~84KB
      clipboard: 只在 post/journals/sheet (代码块复制 + 文章分享链接复制) 加载 · ~11KB
      qmsg / lazysizes 全局保留: 任何页面都可能用 toast 消息 + lazy image 加载.
    -->
    <th:block
      th:if="${(htmlType == 'journals' and #bools.isTrue(theme.config.journals.enable_journal_effect)) or (htmlType == 'friends' and #bools.isTrue(theme.config.friends.enable_friend_effect)) or (htmlType == 'index' and #bools.isTrue(theme.config.home.enable_index_list_effect))}"
    >
      <script defer th:src="${source_link+'/assets/lib/wowjs/wow.min.js'}"></script>
    </th:block>
    <script defer th:src="${source_link+'/assets/lib/lazysizes/lazysizes.min.js'}"></script>
    <script defer th:src="${source_link+'/assets/lib/qmsg/qmsg.js'}"></script>
    <th:block th:if="${htmlType == 'post' or htmlType == 'journals' or htmlType == 'sheet'}">
      <script defer th:src="${source_link+'/assets/lib/clipboard/clipboard.min.js'}"></script>
    </th:block>
    <script
      defer
      th:src="${source_link+'/assets/js/min/utils.min.js?v='+theme.spec.version}"
    ></script>

    <th:block th:if="${htmlType == 'index' && theme.config.carousel.enable_banner}">
      <script defer th:src="${source_link+'/assets/lib/swiper/swiper-bundle.min.js'}"></script>
    </th:block>
    <th:block th:if="${htmlType == 'post'} and ${theme.config.post.enable_toc == true}">
      <script defer th:src="${source_link+'/assets/lib/tocbot/tocbot.min.js'}"></script>
    </th:block>
    <!-- MED-3 v1.6.10: fancybox 仅在可能有图片 lightbox 的页面加载 -->
    <th:block
      th:if="${htmlType == 'post' or htmlType == 'photos' or htmlType == 'journals' or htmlType == 'sheet'}"
    >
      <script defer th:src="${source_link+'/assets/lib/fancybox/jquery.fancybox.min.js'}"></script>
    </th:block>
    <th:block
      th:if="${htmlType == 'post' or (not #lists.isEmpty(theme.config.aside.enable_outpost_aside) and not #lists.isEmpty(theme.config.aside.enable_outpost_aside.?[template_aside == 'enable_music_player' and aside_music_player != null and aside_music_player.music_id != null and #strings.trim(aside_music_player.music_id) != '']))}"
    >
      <link rel="stylesheet" th:href="${source_link+'/assets/lib/APlayer/APlayer.min.css'}" />
      <script defer th:src="${source_link+'/assets/lib/APlayer/APlayer.min.js'}"></script>
      <script defer th:src="${source_link+'/assets/lib/meting/meting.min.js'}"></script>
    </th:block>
    <script
      defer
      th:src="${source_link+'/assets/js/min/custom.min.js?v='+theme.spec.version}"
    ></script>
    <th:block th:if="${theme.config.custom.favicon != null && theme.config.custom.favicon != ''}">
      <script defer th:src="${source_link+'/assets/lib/favico/favico.min.js'}"></script>
    </th:block>
    <th:block
      th:if="${htmlType == 'post' and #bools.isTrue(theme.config.post.enable_share) and #bools.isTrue(theme.config.post.enable_share_weixin) and #bools.isTrue(#annotations.getOrDefault(post, 'enable_share', 'true'))}"
    >
      <script
        defer
        th:src="${source_link+'/assets/lib/jquery-qrcode/jquery.qrcode.min.js'}"
      ></script>
    </th:block>
    <!--相册-->
    <th:block th:if="${htmlType == 'photos'}">
      <script defer th:src="${source_link+'/assets/lib/masonry/isotope.pkgd.min.js'}"></script>
    </th:block>

    <!--===== 引入页面级js start =====-->
    <script
      defer
      th:src="${source_link+'/assets/js/min/common.min.js?v='+theme.spec.version}"
    ></script>
    <th:block th:if="${htmlType == 'post'} or ${htmlType == 'journals'} or ${htmlType == 'sheet'}">
      <script defer th:src="${source_link+'/assets/lib/prism/prism.min.js'}"></script>
    </th:block>
    <th:block th:if="${htmlType == 'index'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/index.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block th:if="${htmlType == 'archives'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/archives.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block th:if="${htmlType == 'post'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/post.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block th:if="${htmlType == 'journals'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/journals.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block th:if="${htmlType == 'friends'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/friends.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block th:if="${htmlType == 'photos'}">
      <script
        defer
        th:src="${source_link+'/assets/js/min/photos.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <th:block
      th:if="${#bools.isTrue(theme.config.beauty.enable_big_banner) and (htmlType == 'index' or htmlType == 'tags' or htmlType == 'categories' or htmlType == 'category' or htmlType == 'archives' or htmlType == 'tag' or htmlType == 'links' or (htmlType == 'author' and #bools.isTrue(theme.config.tags.larger_tabs_image)))}"
    >
      <script
        defer
        th:src="${source_link+'/assets/js/min/beauty.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>

    <!-- ===== 引入页面级js end ===== -->

    <!-- ===== 引入脚本 start ===== -->

    <th:block th:if="${theme.config.footer.enable_busuanzi}">
      <!-- 卜算子 -->
      <script defer th:src="${source_link+'/assets/lib/busuanzi/busuanzi.min.js'}"></script>
    </th:block>

    <!-- 广告关闭按钮 · × 持久化（localStorage） · 不依赖 jQuery -->
    <script
      defer
      th:src="${source_link+'/assets/js/min/ad-close.min.js?v='+theme.spec.version}"
    ></script>

    <!-- ===== 引入脚本 end =====-->
    <th:block th:if="${theme.config.other.enable_debug}">
      <!-- vconsole -->
      <script defer th:src="${source_link+'/assets/lib/vconsole/vconsole.min.js'}"></script>
    </th:block>

    <!--搜索点击-->
    <script>
      const searchButton = document.getElementById('halo-search');
      searchButton.addEventListener('click', function () {
        SearchWidget.open();
      });
    </script>

    <!--    大图配置-->
    <script
      th:inline="javascript"
      th:if="${#bools.isTrue(theme.config.beauty.enable_big_banner) and (htmlType == 'index' or htmlType == 'tags' or htmlType == 'categories' or htmlType == 'category' or htmlType == 'archives' or htmlType == 'tag' or htmlType == 'links' or (htmlType == 'author' and #bools.isTrue(theme.config.tags.larger_tabs_image)))}"
    >
      document.addEventListener('DOMContentLoaded', () => {
        if (!document.getElementById('EvanBigBanner') || typeof EvanBigBanner !== 'function')
          return;
        // 以下配置参数均为默认值
        new EvanBigBanner({
          followMode: false, // 跟随模式
          followTheme: false, // 跟随主题
          titlePrint: true, // 是否启用打字机效果
          titlePrintInterval: 300, // 打字机速度
          titleTiktok: false, // 标题文字抖音效果
          titleText:
            /*[[${(theme.config.beauty.big_banner_title != null and theme.config.beauty.big_banner_title != '') ? theme.config.beauty.big_banner_title : site.title}]]*/ '', // 标题文字
          titleColor: '#ffffff', // 标题文字颜色
          titleShadow: '-3px 2px 6px #1c1f21', // 标题文字阴影
          hitokotoParams: {}, // 一言参数，参考：https://developer.hitokoto.cn/sentence/#%E8%AF%B7%E6%B1%82%E5%8F%82%E6%95%B0
          hitokotoApi: 'https://v1.hitokoto.cn', // 一言API
          hitokotoColor: '#ffffff', // 一言文字颜色
          hitokotoEnable: /*[[${theme.config.beauty.enable_big_banner_hitokoto}]]*/ true, // 是否使用一言
        });
      });

      // 以上配置均为默认值，可直接使用进行初始化
      // new EvanBigBanner();
    </script>
    <th:block th:if="${htmlType == 'photos'}"> </th:block>
    <script
      type="text/javascript"
      th:if="${htmlType == 'index' and #bools.isTrue(theme.config.home.enable_auto_ajax) and #bools.isTrue(theme.config.home.enable_index_list_ajax)}"
    >
      const loading = document.querySelector('.joe_load_container');
      if (loading && 'IntersectionObserver' in window) {
        const ob = new IntersectionObserver(
          (entries) => {
            const domClick = loading.querySelector('.joe_load');
            if (
              entries[0].isIntersecting &&
              domClick &&
              domClick.getAttribute('loading') !== 'true'
            ) {
              domClick.click();
            }
          },
          {
            threshold: 1,
          }
        );
        ob.observe(loading);
      }
    </script>
    <!--
      v1.6.11.4: PluginCommentWidget toast 主题色适配
      上游 <lit-toast> (LitElement) 用 Shadow DOM + 硬编码 #4ccba0 绿色,
      外部 CSS 摸不到. 用 MutationObserver 监听元素出现, 注 stylesheet
      到 shadowRoot, 把 .toast--success 改为 var(--theme).
      仅 patch success (绿色违和), error 红 / warn 橙 保留语义色.
      浏览器要求 adoptedStyleSheets (Chrome 99+/Firefox 101+/Safari 16.4+),
      老浏览器跳过, 静默 fallback 原绿色.
    -->
    <script>
      (function patchHaloCommentToastTheme() {
        if (!('adoptedStyleSheets' in Document.prototype)) return;

        let sheet;
        const getSheet = () => {
          if (sheet) return sheet;
          sheet = new CSSStyleSheet();
          sheet.replaceSync(
            '.toast--success { background-color: var(--theme, #fb6c28) !important; }'
          );
          return sheet;
        };

        const patch = (toast, retries) => {
          if (toast.__joeThemed) return;
          if (!toast.shadowRoot) {
            if (retries > 0) setTimeout(() => patch(toast, retries - 1), 16);
            return;
          }
          toast.__joeThemed = true;
          toast.shadowRoot.adoptedStyleSheets = [
            ...toast.shadowRoot.adoptedStyleSheets,
            getSheet(),
          ];
        };

        document.querySelectorAll('lit-toast').forEach((t) => patch(t, 5));

        new MutationObserver((mutations) => {
          for (const m of mutations) {
            for (const node of m.addedNodes) {
              if (node.nodeType !== 1) continue;
              if (node.tagName === 'LIT-TOAST') patch(node, 5);
              else if (node.querySelectorAll) {
                node.querySelectorAll('lit-toast').forEach((t) => patch(t, 5));
              }
            }
          }
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
    <halo:footer />
  </th:block>
</html>
